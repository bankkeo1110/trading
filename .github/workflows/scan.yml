name: Quét Bollinger Bands

on:
  schedule:
    - cron: "3-59/15 * * * *"   # 15 phút/lần (GitHub có thể trễ vài phút)
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi tin thử (và lấy chat_id) thay vì quét"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Kênh gửi: telegram, zalo, gmail (cách nhau bởi dấu phẩy). Bỏ trống = chỉ telegram.
      CHANNELS: ${{ vars.CHANNELS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
      ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Tuỳ chọn, đặt ở Settings > Secrets and variables > Actions > Variables
      SYMBOLS: ${{ vars.SYMBOLS }}
      TIMEFRAMES: ${{ vars.TIMEFRAMES }}
      NEAR: ${{ vars.NEAR }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mở nhánh data (lưu trạng thái + lịch sử tín hiệu)
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          if git fetch origin data 2>/dev/null; then
            git worktree add data FETCH_HEAD
            git -C data checkout -B data
          else
            git worktree add --detach data
            git -C data checkout --orphan data
            git -C data rm -rfq .
            mkdir -p data/web
            # Chặn Vercel deploy mỗi khi nhánh data có commit mới
            echo '{"git":{"deploymentEnabled":false}}' > data/web/vercel.json
            echo '[]' > data/signals.json
          fi

      - name: Gửi tin thử / lấy chat_id
        if: ${{ inputs.test }}
        run: python -m bot --test

      - name: Quét
        if: ${{ !inputs.test }}
        run: python -m bot

      - name: Lưu nhánh data
        if: always()
        run: |
          cd data
          git add -A
          if ! git diff --cached --quiet; then
            git commit -qm "data: $(date -u +%FT%TZ)"
            # Dashboard có thể vừa lưu settings.json lên nhánh data
            if git fetch origin data 2>/dev/null; then git rebase FETCH_HEAD; fi
            git push origin data
          fi
