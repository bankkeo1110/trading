name: Quét Bollinger Bands

# Mỗi lượt chạy quét liên tục 5 phút/lần trong khoảng 5 giờ rồi tự gọi lượt kế tiếp.
# Lý do: lịch (schedule) của GitHub hay trễ hàng giờ, không đủ tin cậy để quét 15 phút/lần.
# Lịch bên dưới chỉ để khởi động lại nếu chuỗi tự gọi bị đứt.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Gửi tin thử (và lấy chat_id) thay vì quét"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      # Kênh gửi: telegram, zalo, gmail (cách nhau bởi dấu phẩy). Bỏ trống = chỉ telegram.
      CHANNELS: ${{ vars.CHANNELS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
      ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # Tuỳ chọn, đặt ở Settings > Secrets and variables > Actions > Variables
      SYMBOLS: ${{ vars.SYMBOLS }}
      TIMEFRAMES: ${{ vars.TIMEFRAMES }}
      NEAR: ${{ vars.NEAR }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      ADVICE: ${{ vars.ADVICE }}
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mở nhánh data (lưu trạng thái + lịch sử tín hiệu)
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          if git fetch origin data 2>/dev/null; then
            git worktree add data FETCH_HEAD
            git -C data checkout -B data
          else
            git worktree add --detach data
            git -C data checkout --orphan data
            git -C data rm -rfq .
            mkdir -p data/web
            # Chặn Vercel deploy mỗi khi nhánh data có commit mới
            echo '{"git":{"deploymentEnabled":false}}' > data/web/vercel.json
            echo '[]' > data/signals.json
          fi

      - name: Gửi tin thử / lấy chat_id
        if: ${{ inputs.test }}
        run: python -m bot --test

      - name: Quét liên tục
        if: ${{ !inputs.test }}
        run: |
          save_data() {
            git -C data add -A
            if ! git -C data diff --cached --quiet; then
              git -C data commit -qm "data: $(date -u +%FT%TZ)"
              git -C data push -q origin data || echo "::warning::Chưa lưu được nhánh data, sẽ thử lại ở lượt sau"
            fi
          }
          end=$((SECONDS + 5 * 3600))
          while [ $SECONDS -lt $end ]; do
            python -m bot || echo "::warning::Lượt quét có lỗi (xem log ở trên)"
            save_data
            sleep 300
            # Có code hoặc cài đặt mới trên main: dừng để lượt kế tiếp chạy bản mới
            if git fetch -q origin main && [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
              echo "main có thay đổi, chuyển sang lượt chạy mới."
              break
            fi
          done

      - name: Gọi lượt kế tiếp
        if: ${{ !inputs.test && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" --ref main
